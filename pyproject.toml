[project]
name = "slap2-f0"
version = "0.1.0"
description = "Blind-spot network that estimates the baseline (F0) and noise of SLAP2 glutamate imaging movies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "h5py>=3.10",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
slap2-f0 = "slap2_f0.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "code" }

[tool.setuptools.package-data]
slap2_f0 = ["viewer.html"]

[tool.setuptools.packages.find]
where = ["code"]
include = ["slap2_f0*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
